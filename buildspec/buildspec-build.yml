version: 0.2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 516027198635.dkr.ecr.us-east-1.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
  build:
    commands:
      - docker build -t zoyo-inspect .
      - docker tag zoyo-inspect:latest 516027198635.dkr.ecr.us-east-1.amazonaws.com/zoyo-inspect:$COMMIT_HASH
      - docker tag zoyo-inspect:latest 516027198635.dkr.ecr.us-east-1.amazonaws.com/zoyo-inspect:latest
  post_build:
    commands:
      - docker push 516027198635.dkr.ecr.us-east-1.amazonaws.com/zoyo-inspect:$COMMIT_HASH
      - docker push 516027198635.dkr.ecr.us-east-1.amazonaws.com/zoyo-inspect:latest
      - printf '[{"name":"Zoyo-Dev-Frontendinspect-Container","imageUri":"516027198635.dkr.ecr.us-east-1.amazonaws.com/zoyo-inspect:%s"}]' $COMMIT_HASH > imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json
